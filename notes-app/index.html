<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Notes App</h1>
    <h2>take notes and never forget</h2>
    <input id="search-text" type="text" placeholder="Filter notes">

        <option value="byCreated">Sort by recently crated</option>
        <option value="alphabetical">Sort alphabeticaly</option>
    </select>
    <div id="notes"></div>
    <button id="create-note">Create Note</button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
    <script src="notes-functions.js"></script>
    <script src="notes-app.js"></script>
</body>
